<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ЭКСКУРСИЯ ПО LAZY CAMPUS · BLOG UNIVERSITY</title>
<meta name="description" content="выбери героиню и прогуляйся по кампусу blog university: библиотека, большой зал, пиццерия, пруд и кампусы с менторами">
<meta name="theme-color" content="#f7c6d6">
<link rel="preload" href="map.webp" as="image">

<style>
@font-face{font-family:"Anticva";font-weight:400;font-display:swap;src:url(anticva.woff2) format("woff2")}
@font-face{font-family:"RC";font-weight:300;font-style:italic;font-display:swap;src:url(rc-cyr-300i.woff2) format("woff2");unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"RC";font-weight:400;font-display:swap;src:url(rc-cyr-400.woff2) format("woff2");unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"RC";font-weight:700;font-display:swap;src:url(rc-cyr-700.woff2) format("woff2");unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"RC";font-weight:400;font-display:swap;src:url(rc-lat-400.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122}
@font-face{font-family:"RC";font-weight:700;font-display:swap;src:url(rc-lat-700.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122}
body{margin:0;background:#e9e7e2}
a{color:#3f5f80}a:hover{color:#c2316b}
.paper{background:#f7c6d6 url(paper.jpg) repeat}
.pan{transition:transform 1.4s cubic-bezier(.45,0,.25,1)}
.walker{transition:left 1.4s cubic-bezier(.45,0,.25,1), top 1.4s cubic-bezier(.45,0,.25,1)}
.walking{animation:step .32s ease-in-out infinite}
@keyframes step{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-6px) rotate(1.5deg)}}
.idle{animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.lens{animation:lens 1s cubic-bezier(.2,.8,.3,1) both}
@keyframes lens{from{transform:scale(0);opacity:.2}to{transform:scale(1);opacity:1}}
.pulse{animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(242,97,143,.55)}100%{box-shadow:0 0 0 18px rgba(242,97,143,0)}}
.pop{animation:pop .35s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes pop{from{opacity:0;transform:translate(-50%,8px) scale(.9)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
.sheet{animation:up .35s cubic-bezier(.2,.9,.3,1) both}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.fadein{animation:fadein .5s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.btn{transition:transform .15s ease}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(1px)}
.noscroll::-webkit-scrollbar{display:none}
.sheet>*{flex-shrink:0}
@media (prefers-reduced-motion: reduce){.walking,.idle,.lens,.pulse,.pop,.sheet,.fadein{animation:none}.pan,.walker{transition:none}}
</style>

<style>
html,body{height:100%;margin:0;overflow:hidden;background:#f7c6d6 url(paper.jpg) repeat;-webkit-text-size-adjust:100%}
#stage{position:fixed;left:50%;top:50%;width:390px;height:844px;transform-origin:50% 50%}
</style>
</head>
<body>
<div id="stage"></div>
<template id="tpl">


<div style="width: 390px; height: 100%; position: relative; overflow: hidden; background: #a9c6dd; font-family: RC, 'Roboto Condensed', 'Arial Narrow', sans-serif; color: #3f5f80; text-transform: lowercase">

<!-- ================= ВЫБОР ОБРАЗА ================= -->
<sc-if value="{{isIntro}}" hint-placeholder-val="{{ true }}">
<div class="paper" style="position: absolute; inset: 0; display: flex; flex-direction: column">
  <div style="height: 24%; position: relative; overflow: hidden; flex: 0 0 auto">
    <img src="map.webp" alt="" style="position: absolute; left: -330px; top: -330px; width: 1050px">
    <div style="position: absolute; inset: auto 0 0 0; height: 70px; background: linear-gradient(180deg, rgba(247,198,214,0) 0%, #f7c6d6 100%)"></div>
  </div>
  <div style="flex: 1 1 auto; display: flex; flex-direction: column; padding: 0 20px 22px; gap: 12px">
    <span style="font-weight: 700; font-size: 14px; letter-spacing: 1.5px; color: #c2316b; text-transform: uppercase">экскурсия по lazy campus</span>
    <span style="font-family: Anticva, Georgia, serif; font-size: 32px; line-height: 1.04">в каком образе пойдёшь гулять по кампусу?</span>
    <span style="font-size: 16px; line-height: 1.4">выбери себе героиню: она пройдёт по карте и покажет, как устроена учёба</span>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 4px">
      <sc-for list="{{looks}}" as="lk" hint-placeholder-count="4">
        <button class="btn" onClick="{{lk.pick}}" aria-label="образ {{lk.name}}" style="{{lk.style}}">
          <img src="{{lk.src}}" alt="" style="height: 190px; width: auto; max-width: 100%; object-fit: contain">
          <span style="font-weight: 700; font-size: 14px; line-height: 1.1; text-align: center; text-transform: none">{{lk.name}}</span>
        </button>
      </sc-for>
    </div>
    <button class="btn" onClick="{{start}}" style="margin-top: 14px; height: 58px; border: 0; border-radius: 999px; background: #4a77a0; color: #FFFFFF; font-family: RC, sans-serif; font-weight: 700; font-size: 18px; text-transform: lowercase; box-shadow: 0 8px 18px rgba(63,95,128,.28); cursor: pointer">идти в кампус</button>
  </div>
</div>
</sc-if>

<!-- ================= КАРТА ================= -->
<sc-if value="{{isMapLike}}" hint-placeholder-val="{{ false }}">
<div class="fadein" style="position: absolute; inset: 0">
  <div class="pan" style="{{panStyle}}">
    <img src="map.webp" alt="карта кампуса blog university в нью-йорке" style="position: absolute; left: 0; top: 0; width: 1000px; height: 1000px; filter: grayscale(.92) brightness(1.06) contrast(.88)">
    <sc-for list="{{lenses}}" as="ln" hint-placeholder-count="1">
      <div class="lens" style="{{ln.style}}">
        <img src="map.webp" alt="" style="{{ln.imgStyle}}">
      </div>
    </sc-for>

    <sc-if value="{{showPins}}" hint-placeholder-val="{{ true }}">
      <sc-for list="{{pins}}" as="p" hint-placeholder-count="5">
        <div style="{{p.wrap}}">
          <button class="btn pulse" onClick="{{p.go}}" aria-label="{{p.name}}" style="width: 52px; height: 52px; border-radius: 50%; border: 3px solid #FFFFFF; background: #f2618f; cursor: pointer; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
            <span style="width: 10px; height: 10px; border-radius: 50%; background: #FFFFFF"></span>
          </button>
          <span style="padding: 4px 11px; border-radius: 999px; background: #FFFFFF; font-weight: 700; font-size: 14px; letter-spacing: .6px; text-transform: uppercase; color: #3f5f80; white-space: nowrap; box-shadow: 0 3px 8px rgba(63,95,128,.25)">{{p.name}}</span>
        </div>
      </sc-for>
    </sc-if>
    <sc-for list="{{checks}}" as="c" hint-placeholder-count="0">
      <span style="{{c.style}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l4 4 10-10"></path></svg></span>
    </sc-for>

    <!-- героиня -->
    <div class="walker" style="{{walkerStyle}}">
      <span style="position: absolute; left: 50%; bottom: -4px; width: 44px; height: 12px; margin-left: -22px; border-radius: 50%; background: rgba(40,40,60,.28)"></span>
      <div style="{{faceStyle}}">
        <img class="{{stepClass}}" src="{{lookSrc}}" alt="твоя героиня" style="height: 150px; width: auto; display: block">
      </div>
    </div>
  </div>

  <!-- реплика -->
  <sc-if value="{{showSay}}" hint-placeholder-val="{{ true }}">
    <div class="pop" style="{{sayStyle}}">
      {{say}}
      <span style="{{tailStyle}}"></span>
    </div>
  </sc-if>

  <!-- шапка -->
  <div style="position: absolute; top: 0; left: 0; right: 0; padding: 14px 16px 0; display: flex; flex-direction: column; gap: 7px; z-index: 4; pointer-events: none">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="padding: 4px 12px; border-radius: 999px; background: rgba(255,255,255,.85); font-weight: 700; font-size: 13px">blog university · lazy campus</span>
      <span style="padding: 4px 12px; border-radius: 999px; background: rgba(255,255,255,.85); font-weight: 700; font-size: 13px; color: #c2316b">{{stepLabel}}</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px">
      <sc-for list="{{bars}}" as="b" hint-placeholder-count="4">
        <span style="{{b.style}}"></span>
      </sc-for>
    </div>
  </div>

  <!-- подсказка под шапкой -->
  <sc-if value="{{showHint}}" hint-placeholder-val="{{ true }}">
    <div class="paper" style="position: absolute; left: 14px; right: 14px; top: 62px; z-index: 4; border-radius: 22px; padding: 10px 10px 10px 14px; display: flex; align-items: center; gap: 10px; box-shadow: 0 8px 20px rgba(63,95,128,.22)">
      <span style="font-family: Anticva, Georgia, serif; font-size: 30px; color: #c2316b; line-height: 1; flex: 0 0 auto">{{visitedCount}}/5</span>
      <span style="font-size: 14px; line-height: 1.3; flex: 1 1 auto">{{hintText}}</span>
      <sc-if value="{{notAll}}" hint-placeholder-val="{{ true }}">
        <button class="btn" onClick="{{toApp}}" style="flex: 0 0 auto; min-height: 44px; padding: 0 12px; border: 2px solid #FFFFFF; border-radius: 999px; background: rgba(255,255,255,.55); color: #3f5f80; font-family: RC, sans-serif; font-size: 14px; text-transform: lowercase; cursor: pointer">пропустить</button>
      </sc-if>
    </div>
  </sc-if>
  <sc-if value="{{showDone}}" hint-placeholder-val="{{ false }}">
    <button class="btn" onClick="{{toApp}}" style="position: absolute; left: 14px; right: 14px; bottom: 16px; z-index: 4; height: 56px; border: 0; border-radius: 999px; background: #4a77a0; color: #FFFFFF; font-family: RC, sans-serif; font-weight: 700; font-size: 17px; text-transform: lowercase; box-shadow: 0 8px 18px rgba(63,95,128,.28); cursor: pointer">дальше</button>
  </sc-if>

  <!-- шторка места -->
  <sc-if value="{{sheetOpen}}" hint-placeholder-val="{{ false }}">
    <div class="sheet paper noscroll" style="position: absolute; left: 0; right: 0; bottom: 0; height: 56%; overflow-y: auto; border-radius: 28px 28px 0 0; padding: 16px 18px 22px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; z-index: 5; box-shadow: 0 -10px 30px rgba(63,95,128,.25)">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-weight: 700; font-size: 14px; color: #c2316b">{{sheetKicker}}</span>
        <sc-if value="{{canClose}}" hint-placeholder-val="{{ true }}">
          <button onClick="{{closeSheet}}" aria-label="закрыть" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255,255,255,.8); cursor: pointer; display: flex; align-items: center; justify-content: center">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3f5f80" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
          </button>
        </sc-if>
      </div>

      <sc-if value="{{isLib}}" hint-placeholder-val="{{ false }}">
        <span style="font-family: Anticva, Georgia, serif; font-size: 32px; line-height: 1">библиотека</span>
        <div style="background: rgba(255,255,255,.58); border-radius: 22px; padding: 14px 16px; font-size: 16px; line-height: 1.5">доступ на лейзи-кампусе откроется сразу в начале обучения ко всей библиотеке уроков, а выбранный трек обучения поможет понять, в каком порядке их смотреть — смотреть уроки можно в своём cozy-темпе<br><br>всю программу сможешь посмотреть в конце экскурсии в библиотеке и даже посмотреть один из уроков (тссс это секрет🤫)</div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
          <div style="background: #FFFFFF; border-radius: 20px; padding: 12px 14px; display: flex; flex-direction: column"><span style="font-family: Anticva, Georgia, serif; font-size: 32px; color: #c2316b">115</span><span style="font-size: 14px">уроков в главном кампусе</span></div>
          <div style="background: #FFFFFF; border-radius: 20px; padding: 12px 14px; display: flex; flex-direction: column"><span style="font-family: Anticva, Georgia, serif; font-size: 32px; color: #c2316b">9</span><span style="font-size: 14px">направлений плюс курсовые</span></div>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 6px">
          <sc-for list="{{topics}}" as="tp" hint-placeholder-count="9">
            <span style="padding: 4px 11px; border-radius: 999px; background: rgba(255,255,255,.7); font-size: 14px"><b style="color: #c2316b">{{tp.n}}</b> {{tp.name}}</span>
          </sc-for>
        </div>
        <div style="background: #fbd7e4; border-radius: 18px; padding: 12px 16px; font-size: 15px; line-height: 1.45">а ещё на lazy campus будут открытые лекции от директора. загляни в большой зал.</div>
      </sc-if>

      <sc-if value="{{isHall}}" hint-placeholder-val="{{ false }}">
        <span style="font-family: Anticva, Georgia, serif; font-size: 32px; line-height: 1">большой зал</span>
        <div style="background: rgba(255,255,255,.58); border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px">
          <span style="font-weight: 700; font-size: 14px; color: #c2316b">открытые лекции</span>
          <span style="font-size: 16px; line-height: 1.5">здесь директор проводит особые онлайн-лекции для всего потока. на этом лейзи-потоке таких лекций будет 5 — самая актуальная информация в живом формате.<br><br>в целом, говорят, если прийти только сюда и не посмотреть ни один урок, шансы вырастить блог всё ещё большие🤣🙏🏼 информэйшен будет просто в точку.</span>
        </div>
        <div style="background: #dce8f2; border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px">
          <span style="font-weight: 700; font-size: 14px; color: #c2316b">только на lazy-потоке</span>
          <span style="font-family: Anticva, Georgia, serif; font-size: 22px">пижамная вечеринка</span>
          <span style="font-size: 16px; line-height: 1.5">3 раза на лейзи-потоке вместо посиделок у пруда откроется возможность попасть на пижамную вечеринку с директором — то есть возможность получить разбор от директора в чате…</span>
        </div>
      </sc-if>

      <sc-if value="{{isPizza}}" hint-placeholder-val="{{ false }}">
        <span style="font-family: Anticva, Georgia, serif; font-size: 32px; line-height: 1">пиццерия</span>
        <div style="background: rgba(255,255,255,.58); border-radius: 22px; padding: 14px 16px; font-size: 16px; line-height: 1.5">самое уютное место, где собираются все студенты: болтают, поддерживают друг друга, делятся успехами, встречаются вживую в городах<br><br>скажу так: комьюнити BLOG UNI — это то, что не описать словами, надо хотя бы один раз попасть, чтобы понять🥹 это саааамое лучшее комьюнити эвер.</div>
        <div style="background: #FFFFFF; border-radius: 22px; padding: 10px; display: flex; flex-direction: column; gap: 8px">
          <span style="align-self: center; font-size: 12px; background: rgba(63,95,128,.55); color: #FFFFFF; padding: 2px 10px; border-radius: 999px">можешь почитать примеры сообщений:</span>
          <img src="pizza1.jpg" alt="сообщения студенток саши и вики в чате пиццерия" style="width: 100%; border-radius: 14px">
          <img src="pizza2.jpg" alt="сообщение студентки юлии в чате пиццерия" style="width: 100%; border-radius: 14px">
        </div>
      </sc-if>

      <sc-if value="{{isPond}}" hint-placeholder-val="{{ false }}">
        <span style="font-family: Anticva, Georgia, serif; font-size: 32px; line-height: 1">пруд</span>
        <div style="background: rgba(255,255,255,.58); border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px">
          <span style="font-weight: 700; font-size: 14px; color: #c2316b">пикник с ментором</span>
          <span style="font-size: 16px; line-height: 1.5">ох, здесь у нас каждый день работает дежурный ментор и не пропускает ни одного запроса!! с понедельника по пятницу ментор из основного состава (а они у нас самые крутые, реально…) отвечает на любой вопрос по блогу &amp; делает разбор любого контента.<br><br>как итог: за всё обучение ты можешь забрать опыт не только директора, но и всех наших менторов-больших блогеров с их уникальными superpowers🦸🏼</span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px">
          <sc-for list="{{week}}" as="d" hint-placeholder-count="7">
            <div style="{{d.style}}"><span style="font-weight: 700; font-size: 15px">{{d.day}}</span><span style="font-size: 10px">{{d.note}}</span></div>
          </sc-for>
        </div>
        <div style="background: #dce8f2; border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px">
          <span style="font-weight: 700; font-size: 14px; color: #c2316b">новое</span>
          <span style="font-family: Anticva, Georgia, serif; font-size: 22px">недели от ментора</span>
          <span style="font-size: 16px; line-height: 1.5">что-то новенькое: теперь у нас будут ещё и недели от ментора, где ментор делится со всем потоком материалом от себя, отражающим его суперсилу!</span>
        </div>
      </sc-if>

      <sc-if value="{{isCampus}}" hint-placeholder-val="{{ false }}">
        <span style="font-family: Anticva, Georgia, serif; font-size: 32px; line-height: 1">кампусы с менторами</span>
        <div style="background: rgba(255,255,255,.58); border-radius: 22px; padding: 14px 16px; font-size: 16px; line-height: 1.5">все студенты живут в кампусах в комнатах с рум мейт, с которым можно вместе идти к целям в блоге. у каждого кампуса есть свой ментор. ментор составляет для тебя индивидуальную стратегию блога и ведёт тебя к целям весь поток💔</div>
        <span style="font-weight: 700; font-size: 14px; color: #c2316b">так выглядит стратегия</span>
        <div style="height: 280px; border-radius: 26px; background: #FFFFFF; padding: 7px; box-sizing: border-box">
          <img src="strategy.webp" alt="пример индивидуальной стратегии от ментора" style="width: 100%; height: 100%; object-fit: cover; object-position: top; border-radius: 20px">
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <sc-for list="{{campuses}}" as="c" hint-placeholder-count="6">
            <div style="display: flex; justify-content: space-between; gap: 10px; padding: 9px 14px; border-radius: 16px; background: #FFFFFF"><span style="font-family: Anticva, Georgia, serif; font-size: 16px">{{c.name}}</span><span style="font-size: 14px">{{c.mentor}}</span></div>
          </sc-for>
        </div>
      </sc-if>

      <sc-if value="{{isStars}}" hint-placeholder-val="{{ false }}">
        <span style="font-family: Anticva, Georgia, serif; font-size: 32px; line-height: 1">обсерватория на эмпайр-стейт</span>
        <div style="background: rgba(255,255,255,.58); border-radius: 22px; padding: 14px 16px; font-size: 16px; line-height: 1.5">с самой высокой точки кампуса видно наших звёзд: здесь собраны легендарные студенты <span style="text-transform: none">BLOG UNI</span>.🔭⭐️<br><br>да, тут целых 400 звёзд — это каждый шестой студент, оформленный здесь, а ведь мы успеваем выкладывать не всё и делимся только результатами за поток… так что это не случайность, а высокий результат методологии обучения.</div>
        <a class="btn" href="https://t.me/+I6qqpE0opVM5OTE6" target="_blank" style="height: 54px; border-radius: 999px; background: #4a77a0; color: #FFFFFF; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; text-decoration: none; box-shadow: 0 6px 16px rgba(63,95,128,.24)">посмотреть на 400 звёзд ⭐️</a>
        <button class="btn" onClick="{{toFinal}}" style="height: 50px; border: 2px solid #FFFFFF; border-radius: 999px; background: rgba(255,255,255,.4); color: #3f5f80; font-family: RC, sans-serif; font-size: 16px; text-transform: lowercase; cursor: pointer">последняя точка экскурсии</button>
      </sc-if>

      <sc-if value="{{isFinal}}" hint-placeholder-val="{{ false }}">
        <span style="font-family: Anticva, Georgia, serif; font-size: 30px; line-height: 1.02">забеги в библиотеку перед выходом</span>
        <sc-if value="{{noPass}}" hint-placeholder-val="{{ true }}">
          <span style="font-size: 16px; line-height: 1.5">без пропуска туда не пускают. держи, я поделюсь своим, только никому не говори…</span>

      dopamine: { name: 'dopamine girl', src: 'dopamine.webp' },
      extra: { name: 'EXTRA-girl', src: 'extra.webp' }

    const P = {
      gate:   { name: 'ворота', lx: 605, ly: 515, sx: 600, sy: 575, r: 70 },
      hall:   { name: 'большой зал', lx: 420, ly: 500, sx: 425, sy: 600, r: 120 },
      lib:    { name: 'библиотека', lx: 465, ly: 780, sx: 470, sy: 870, r: 95 },
      pizza:  { name: 'пиццерия', lx: 250, ly: 670, sx: 255, sy: 740, r: 95 },
      pond:   { name: 'пруд', lx: 415, ly: 650, sx: 360, sy: 700, r: 85 },
      campus: { name: 'кампусы', lx: 565, ly: 640, sx: 570, sy: 715, r: 100 },
      stars:  { name: 'эмпайр-стейт', lx: 740, ly: 570, sx: 745, sy: 690, r: 115 }

      gate: 'привет! я старшекурсница lazy campus. нажимай на точки, я проведу',
      hall: 'это большой зал: здесь лекции директора',
      lib: 'библиотека! тут все 115 уроков',
      pizza: 'а здесь мы болтаем по вечерам',
      pond: 'пикник с ментором каждый будний день',
      campus: 'здесь живут менторы со своими кампусами',
      stars: 'с крыши эмпайр-стейт видно наших звёзд',
      lib_final: 'последняя точка: снова библиотека',
      done: 'ты обошла весь кампус! жми «дальше»'

    const checks = order.filter((k) => s.visited[k] && !(s.walking && k === s.pos)).map((k) => ({
      style: 'position:absolute;left:' + (P[k].lx + 18) + 'px;top:' + (P[k].ly - 46) + 'px;width:26px;height:26px;border-radius:50%;background:#f2618f;border:2px solid #FFFFFF;display:flex;align-items:center;justify-content:center;z-index:2'
    }));
    const stepIdx = s.screen === 'app' ? 2 : (s.phase === 'explore' ? 1 : (s.phase === 'stars' ? 3 : 4));
    const sayKey = (s.walking || s.open || s.phase !== 'explore') ? null : (all ? 'done' : (visitedCount === 0 ? 'gate' : null));
    const kickers = { lib: 'место 1 · библиотека', hall: 'место · большой зал', pizza: 'место · пиццерия', pond: 'место · пруд', campus: 'место · кампусы', stars: 'шаг 3 · обсерватория', final: 'шаг 4 · финальная точка' };
    const days = ['пн','вт','ср','чт','пт','сб','вс'];
    const shotDefs = [['home','главная'],['track','трек и шаги'],['look','распаковка']];
    return {
      isIntro: s.screen === 'intro', isMapLike: s.screen !== 'intro', isApp: s.screen === 'app',
      looks: Object.keys(LOOKS).map((k) => ({
        name: LOOKS[k].name, src: LOOKS[k].src,
        pick: () => this.setState({ look: k }),
        style: 'display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px 8px;border-radius:20px;cursor:pointer;font-family:RC,sans-serif;color:#3f5f80;text-transform:lowercase;' + (s.look === k ? 'background:#FFFFFF;border:3px solid #f2618f;box-shadow:0 8px 18px rgba(63,95,128,.18)' : 'background:rgba(255,255,255,.45);border:3px solid transparent')

      tailStyle: 'position:absolute;left:calc(50% + ' + Math.round(charX - bubX) + 'px);bottom:-7px;width:16px;height:16px;margin-left:-8px;background:#FFF8DC;transform:rotate(45deg)',

      topics: [
        { name: 'личный бренд', n: 8 }, { name: 'упаковка профиля и рилс', n: 10 },
        { name: 'стиль, съёмка и монтаж', n: 18 }, { name: 'сторис', n: 9 },
        { name: 'монетизация и продвижение', n: 10 }, { name: 'работа с брендами', n: 16 },
        { name: 'ugc', n: 3 }, { name: 'продукт, прогрев и продажи', n: 19 },
        { name: 'многоканальность', n: 18 }
      ],
      week: days.map((d, i) => ({ day: d, note: i < 5 ? 'дежурный' : (i === 5 ? 'выходной' : 'основной'),
        style: 'display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0;border-radius:14px;' + (i < 5 ? 'background:#4a77a0;color:#FFFFFF' : (i === 5 ? 'background:rgba(255,255,255,.35);color:#3f5f80;border:1.5px dashed #FFFFFF' : 'background:#FFFFFF;color:#3f5f80')) })),
      campuses: [
        { name: 'ambitious princess', mentor: 'аня корпунова' },
        { name: 'intellectual women', mentor: 'даша морковских' },
        { name: 'money talks', mentor: 'катя тэва' },
        { name: 'pink place', mentor: 'анна-мария' },
        { name: 'drama queen core', mentor: 'софи борисова' },
        { name: 'big life energy', mentor: 'паша' }
      ],
      shots: shotDefs.map((d) => ({ label: d[1], pick: () => this.setState({ shot: d[0] }),
        style: 'min-height:40px;padding:6px 14px;border-radius:999px;border:2px solid #FFFFFF;font-family:RC,sans-serif;font-size:15px;cursor:pointer;text-transform:lowercase;' + (s.shot === d[0] ? 'background:#FFFFFF;color:#c2316b;font-weight:700' : 'background:rgba(255,255,255,.5);color:#3f5f80') })),
      shotHome: s.shot === 'home', shotTrack: s.shot === 'track', shotLook: s.shot === 'look',
      noPass: !s.pass, hasPass: !!s.pass,
      takePass: () => this.setState({ pass: true }),
      restart: () => { if (this.t) clearTimeout(this.t); this.setState({ screen: 'intro', pos: 'gate', walking: false, facing: 1, open: null, visited: {}, phase: 'explore', pass: false, shot: 'home' }); }
    };
  }
}

var stage=document.getElementById('stage');
function fit(){
  var vw=window.innerWidth, vh=window.innerHeight, s=vw/390, H=vh/s;
  // телефон: растягиваем на весь экран; компьютер и планшет: телефон по центру
  if(H<640 || H>1000){ s=Math.min(vw/390, vh/844); H=844; }
  window.__stageH=H; stage.style.height=H+'px';
  stage.style.transform='translate(-50%,-50%) scale('+s+')';
  if(window.__comp) window.__comp.forceUpdate();
}
fit();
preact.render(preact.h(Component,{ref:function(c){window.__comp=c;}}),stage);
window.addEventListener('resize',fit); window.addEventListener('orientationchange',function(){setTimeout(fit,200)});
</script>
